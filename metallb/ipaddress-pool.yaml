apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan60-ip-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.10.60.200-10.10.60.210  # OPNsense DHCP 범위 밖의 남는 IP 대역
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vlan60-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - vlan60-ip-pool
