apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://ot-container-kit.github.io/helm-charts/
      chart: redis-operator
      targetRevision: 0.25.0
    - repoURL: https://github.com/kkw855/infra-k3s.git
      targetRevision: main
      path: apps/redis/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # CRD 스키마가 커서 client-side apply 256KB annotation 제한에 걸림 (arc-controller/postgres와 동일한 이유)
      - ServerSideApply=true
