---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-auth
  namespace: minio
  annotations:
    # Helm 차트가 만드는 Deployment보다 먼저 Secret이 존재해야 하므로 PreSync
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    rootPassword: 
    rootUser: 
  template:
    metadata:
      name: minio-auth
      namespace: minio
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-1"
    type: Opaque
