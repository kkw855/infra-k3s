apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.0
      helm:
        valueFiles:
          - $values/apps/cert-manager/values-cert-manager.yaml
    - repoURL: https://github.com/kkw855/infra-k3s.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/kkw855/infra-k3s.git
      targetRevision: main
      path: apps/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
